# ==================================================
#  公開用の設定（application.properties の値を、ここに書いたものだけ上書きする）
#
#  使い方：起動するときに「prod」を指定する
#    java -jar recipesmanagement-0.0.1-SNAPSHOT.jar --spring.profiles.active=prod
#  または、環境変数 SPRING_PROFILES_ACTIVE=prod を設定してから起動する
#
#  ${名前} は環境変数から読む。パスワードや URL はサーバーごとに違い、
#  Git にも載せたくないので、ここには書かずに環境変数で渡す。
#  必要な環境変数が無いときは、アプリが起動しない（設定し忘れたまま公開しないように）。
#
#  必要な環境変数：
#    DB_URL       データベースの場所（例：jdbc:h2:file:/var/recipe/data/recipes）
#    DB_PASSWORD  データベースのパスワード（空にしない）
#    UPLOAD_DIR   写真の保存先のフォルダ（例：/var/recipe/uploads）
#    PUBLIC_URL   公開した URL（例：https://recipe.example.com）。パスワード再設定のメールのリンクに使う
#    BACKUP_DIR   データベースの控え（毎日 3:00 に作る zip）の保存先（例：/var/recipe/backups）
#  任意：
#    DB_USERNAME  データベースのユーザー名（無ければ sa）
# ==================================================

# ----- データベース -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}

# 実行した SQL をログに出さない（ログが大量になり、中身も見えてしまうため）
spring.jpa.show-sql=false

# H2 のデータベース管理画面（/h2-console）を使えないようにする
spring.h2.console.enabled=false

# ----- ログ -----
# セキュリティの細かいログ（DEBUG）は出さない
logging.level.org.springframework.security=WARN

# ----- 写真・URL -----
app.upload-dir=${UPLOAD_DIR}
app.public-url=${PUBLIC_URL}

# ----- データベースの控え -----
app.backup.dir=${BACKUP_DIR}

# ----- AI -----
# 公開するサーバーには Ollama が無いので、AI 機能は使わない（画面の AI の欄も出さない）
app.ai.enabled=false

# ----- ログインの Cookie（セッション） -----
# secure：HTTPS のときだけ Cookie を送る（公開するときは必ず HTTPS にする）
# http-only：JavaScript から Cookie を読めないようにする
# same-site=lax：ほかのサイトからの POST には Cookie を付けない
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ログインしたまま何もしないと、30分で自動的にログアウトする
server.servlet.session.timeout=30m

# ----- エラー画面 -----
# エラーの詳しい中身（プログラムの場所など）を画面に出さない
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# ----- HTTPS の受け付け -----
# HTTPS を nginx などのサーバーが受けて、このアプリには HTTP で渡す形のとき、
# 「もとは HTTPS だった」ことを正しく受け取る（同じサーバー内からの情報だけ信用する）
server.forward-headers-strategy=native
