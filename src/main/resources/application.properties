spring.application.name=recipesmanagement
server.port=8081

spring.datasource.url=jdbc:h2:~/Recipes;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true

logging.level.org.springframework.security=DEBUG

# ----- 写真のアップロード -----
# 1ファイルの最大サイズ
spring.servlet.multipart.max-file-size=5MB
# 1回の送信全体（写真＋入力内容）の最大サイズ
spring.servlet.multipart.max-request-size=10MB
# 写真の保存先（フルパスで書く。Windows でも / で区切ってよい）
app.upload-dir=C:/RecipesManagement/recipesmanagement/src/main/resources/static/images/recipes_photo