spring.application.name=recipesmanagement
server.port=8081

spring.datasource.url=jdbc:h2:~/Recipes;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true

logging.level.org.springframework.security=DEBUG

# ----- 写真のアップロード -----
# 1ファイルの最大サイズ
spring.servlet.multipart.max-file-size=5MB
# 1回の送信全体（写真＋入力内容）の最大サイズ
spring.servlet.multipart.max-request-size=10MB
# 写真の保存先（フルパスで書く。Windows でも / で区切ってよい）
app.upload-dir=C:/RecipesManagement/recipesmanagement/src/main/resources/static/images/recipes_photo

# ===== メール（パスワードのリセット用） =====
# mail-secret.properties を読み込む。optional：ファイルが無くても起動はできる（メールが送れないだけ）
# ai-secret.properties も同じく optional（無くても起動でき、AI機能が「未設定」になるだけ）
spring.config.import=optional:classpath:mail-secret.properties,optional:classpath:ai-secret.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.public-url=

# ===== AI（料理サポート。Claude API） =====
# APIキーは Git に入れない ai-secret.properties に app.ai.api-key=... と書く（ここは空のまま）
# ここが空なら環境変数 ANTHROPIC_API_KEY を使う。どちらも無ければ AI 機能は「未設定」と表示される
app.ai.api-key=
# 使うモデル。料金を抑えたいときは claude-haiku-5-5 などに変える
app.ai.model=claude-opus-5-5
