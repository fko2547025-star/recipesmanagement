spring.application.name=recipesmanagement
server.port=8081

spring.datasource.url=jdbc:h2:~/Recipes;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.h2.console.enabled=true

logging.level.org.springframework.security=DEBUG

# ----- 写真のアップロード -----
# 1ファイルの最大サイズ
spring.servlet.multipart.max-file-size=5MB
# 1回の送信全体（写真＋入力内容）の最大サイズ
spring.servlet.multipart.max-request-size=10MB
# 写真の保存先（フルパスで書く。Windows でも / で区切ってよい）
# プロジェクトの外のフォルダにする。プロジェクトの中だと、投稿された写真が Git やビルドしたアプリ（jar）に入ってしまうため
# 公開用のサーバーでは、環境変数 UPLOAD_DIR で決める（application-prod.properties）
app.upload-dir=C:/RecipesManagement/uploads

# ----- データベースの控え（バックアップ） -----
# 毎日 3:00 に、データベースを zip で保存する（BackupService）。7日より古いものは消す。空にすると作らない
# 公開用のサーバーでは、環境変数 BACKUP_DIR で決める（application-prod.properties）
app.backup.dir=C:/RecipesManagement/backups
app.backup.cron=0 0 3 * * *
app.backup.keep-days=7

# ===== メール（パスワードのリセット用） =====
# mail-secret.properties（Gmail のアドレスとアプリパスワード）を読み込む。
# optional：ファイルが無くても起動はできる（メールが送れないだけ）
# プロジェクトの直下（pom.xml と同じ場所）に置く。src/main/resources に置くと、ビルドしたアプリ（jar）の中に
# パスワードが入ってしまうため。公開用のサーバーでは、ファイルではなく環境変数
# SPRING_MAIL_USERNAME・SPRING_MAIL_PASSWORD で渡す
spring.config.import=optional:file:./mail-secret.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# パスワード再設定のメールのリンクの先頭。空だとメールを送らない（偽のリンクを作られないように）
# 公開するときは、公開した URL（例：https://recipe.example.com）にする
app.public-url=http://localhost:8081

# ===== 運営者の情報（フッター・プライバシーポリシー・利用規約に表示する） =====
# 書かなければ、運営者名は「Recipe 運営チーム」、問い合わせ先は「【問い合わせ先】」と表示する（SiteInfoAdvice）
# 問い合わせ先（メールアドレスや問い合わせフォームの URL など）は、公開する前に必ず書く。例：
#   app.contact=recipe.support@example.com
# 注意：このファイルに日本語の値を書くと文字化けする（Spring は .properties を日本語に対応しない文字コードで読むため）。
#       日本語にしたいときは、環境変数 APP_OPERATOR_NAME・APP_CONTACT で渡す

# ===== AI（料理サポート。パソコンで動かす Ollama を使う。料金はかからない） =====
# false にすると AI 機能を使わない（画面の AI の欄も出さない）。公開用の設定では false にしている
app.ai.enabled=true
# Ollama の場所（パソコンに Ollama を入れて起動しておくと、ここで待ち受けている）
app.ai.ollama-url=http://localhost:11434
# 使うモデル（先に ollama pull qwen2.5:7b で取り込んでおく）。パソコンが重いときは qwen2.5:3b に変える
app.ai.model=qwen2.5:7b
