<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
</head>
<body>
    <h1>新規登録</h1>

    <p th:if="${error}" th:text="${error}">エラーメッセージ</p>

    <form th:action="@{/register}" method="post">
        <p>ユーザー名：<input type="text" name="username" maxlength="50" required></p>
        <p>パスワード：<input type="password" name="password" minlength="4" required></p>
        <button type="submit">登録</button>
    </form>

    <a href="/login">ログイン画面に戻る</a>
</body>
</html>
