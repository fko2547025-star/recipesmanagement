<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('新規登録')}"></head>
<body class="auth-page">

    <main class="auth-card">
        <a href="/recipes" class="brand brand--large">
            <span class="material-symbols-rounded">soup_kitchen</span>Recipi
        </a>
        <p class="auth-card__lead">新規登録して始めましょう！</p>

        <!-- エラーメッセージ（ユーザー名の重複など）。AuthController から渡される -->
        <div th:if="${error}" class="alert alert--error">
            <span class="material-symbols-rounded">error</span><span th:text="${error}">エラー</span>
        </div>

        <!-- 送信先は AuthController の @PostMapping("/register") -->
        <form th:action="@{/register}" method="post" class="auth-form">
            <label class="input-icon">
                <span class="material-symbols-rounded">person</span>
                <input type="text" name="username" th:value="${username}" placeholder="ユーザーID" maxlength="50" required autocomplete="username">
            </label>
            <label class="input-icon">
                <span class="material-symbols-rounded">lock</span>
                <!-- new-password：ブラウザが新しいパスワードの提案を出せるようにする -->
                <input type="password" name="password" id="password" placeholder="パスワード（4文字以上）" minlength="4" required
                       autocomplete="new-password">
            </label>
            <label class="input-icon">
                <span class="material-symbols-rounded">lock_reset</span>
                <!-- 確認用。name を passwordConfirm にして、サーバーでも password と同じか確かめる -->
                <input type="password" name="passwordConfirm" id="passwordConfirm" placeholder="パスワード（確認）"
                    minlength="4" required autocomplete="new-password" autocapitalize="off" autocorrect="off">
            </label>
            <button type="submit" class="btn--block">登録する</button>
        </form>

        <a href="/login" class="auth-card__link">ログインはこちら</a>
    </main>
    <script>
        // 確認欄が、パスワードと同じかどうかを調べる
        const password = document.getElementById('password');
        const confirmInput = document.getElementById('passwordConfirm');

        function checkMatch() {
            // setCustomValidity：文字を入れると「この欄はエラー」になり、送信が止まって吹き出しでメッセージが出る
            //                    空文字にすると「エラーなし」に戻る
            if (confirmInput.value !== '' && confirmInput.value !== password.value) {
                confirmInput.setCustomValidity('パスワードが一致しません');
            } else {
                confirmInput.setCustomValidity('');
            }
        }

        // どちらかの欄に入力するたびにチェックする
        password.addEventListener('input', checkMatch);
        confirmInput.addEventListener('input', checkMatch);
    </script>

</body>
</html>
