<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('プロフィール編集')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container container--narrow">
        <a href="/mypage" class="back-link">
            <span class="material-symbols-rounded">arrow_back</span>マイページに戻る
        </a>
        <h1 class="page-title">
            <span class="material-symbols-rounded">manage_accounts</span>プロフィール編集
        </h1>

        <div th:if="${errors != null}" class="alert alert--error">
            <span class="material-symbols-rounded">error</span>
            <ul class="alert__list">
                <li th:each="e : ${errors}" th:text="${e}">エラー</li>
            </ul>
        </div>

        <!-- 写真を送るので multipart/form-data -->
        <form th:action="@{/mypage/profile}" method="post" enctype="multipart/form-data" class="card">

            <!-- ===== プロフィール写真 ===== -->
            <div class="profile-form__avatar">
                <span class="avatar avatar--xl" th:classappend="'frame--' + ${level.rank}">
                    <img id="avatarPreview" alt=""
                         th:src="${user.avatarPath != null} ? @{/uploads/{file}(file=${user.avatarPath})} : ''"
                         th:classappend="${user.avatarPath == null} ? 'is-hidden'">
                    <span id="avatarIcon" class="material-symbols-rounded"
                          th:classappend="${user.avatarPath != null} ? 'is-hidden'">person</span>
                </span>

                <label class="btn btn--outline btn--sm">
                    <span class="material-symbols-rounded">photo_camera</span>写真を選ぶ
                    <input type="file" name="avatar" accept="image/jpeg,image/png,image/webp,image/gif"
                           class="visually-hidden" onchange="previewAvatar(this)">
                </label>
                <label th:if="${user.avatarPath != null}" class="check">
                    <input type="checkbox" name="removeAvatar" value="true"> 写真を削除する
                </label>
            </div>

            <!-- ===== ニックネーム ===== -->
            <div class="form-field">
                <label for="nickname">ニックネーム</label>
                <input type="text" id="nickname" name="nickname" th:value="${nickname}"
                       th:attr="maxlength=${nicknameMax}" placeholder="例：はるお">
                <small class="field-hint"
                       th:text="'レシピやコメントに表示される名前です。空欄にすると、ユーザー名（' + ${user.username} + '）が表示されます'">
                    空欄にすると、ユーザー名が表示されます
                </small>
            </div>

            <div class="form-field">
                <label>ユーザー名（ログイン用・変更できません）</label>
                <input type="text" th:value="${user.username}" disabled>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn--wide">保存する</button>
                <a href="/mypage" class="btn btn--outline">キャンセル</a>
            </div>

            <!-- パスワードの変更は別の画面で行う -->
            <p class="profile-form__password">
                <a href="/mypage/password">
                    <span class="material-symbols-rounded">lock</span>パスワードを変更する
                </a>
            </p>
        </form>
    </main>

    <script>
        // 選んだ写真をその場で丸の中に表示する（まだ保存はしない）
        function previewAvatar(input) {
            const file = input.files[0];
            if (!file) {
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('写真は5MB以下のものを選んでください');
                input.value = '';
                return;
            }
            const img = document.getElementById('avatarPreview');
            img.src = URL.createObjectURL(file);
            img.classList.remove('is-hidden');
            document.getElementById('avatarIcon').classList.add('is-hidden');
        }
    </script>
</body>
</html>
