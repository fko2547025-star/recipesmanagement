<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('パスワードの変更')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container container--narrow">
        <a href="/mypage/profile" class="back-link">
            <span class="material-symbols-rounded">arrow_back</span>プロフィール編集に戻る
        </a>
        <h1 class="page-title">
            <span class="material-symbols-rounded">lock</span>パスワードの変更
        </h1>

        <div th:if="${errors != null}" class="alert alert--error">
            <span class="material-symbols-rounded">error</span>
            <ul class="alert__list">
                <li th:each="e : ${errors}" th:text="${e}">エラー</li>
            </ul>
        </div>

        <form th:action="@{/mypage/password}" method="post" class="card">
            <!--
                autocomplete：ブラウザのパスワード保存機能に、どの欄が何かを教える
                current-password = 今のパスワード（保存済みのものを入れてくれる）
                new-password     = 新しいパスワード（新しく作る候補を出してくれる）
            -->
            <div class="form-field">
                <label for="currentPassword">今のパスワード</label>
                <input type="password" id="currentPassword" name="currentPassword" required
                       autocomplete="current-password" autocapitalize="off" autocorrect="off">
            </div>

            <div class="form-field">
                <label for="newPassword">新しいパスワード</label>
                <input type="password" id="newPassword" name="newPassword" required
                       th:attr="minlength=${minLength}"
                       autocomplete="new-password" autocapitalize="off" autocorrect="off">
                <small class="field-hint" th:text="${minLength} + '文字以上'">4文字以上</small>
            </div>

            <div class="form-field">
                <label for="confirmPassword">新しいパスワード（確認）</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required
                       autocomplete="new-password" autocapitalize="off" autocorrect="off">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn--wide">変更する</button>
                <a href="/mypage/profile" class="btn btn--outline">キャンセル</a>
            </div>
        </form>
    </main>

    <script>
        // 新規登録と同じ：確認欄が新しいパスワードと違えば、送信を止めて吹き出しで知らせる
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');

        function checkMatch() {
            if (confirmPassword.value !== '' && confirmPassword.value !== newPassword.value) {
                confirmPassword.setCustomValidity('新しいパスワードが一致しません');
            } else {
                confirmPassword.setCustomValidity('');
            }
        }

        newPassword.addEventListener('input', checkMatch);
        confirmPassword.addEventListener('input', checkMatch);
    </script>
</body>
</html>
