<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('レシピ一覧')}"></head>
<body>
    <!-- 共通ナビゲーション -->
    <div th:replace="~{fragments/header :: header}"></div>
    <!-- ヒーロー：ページ上部の大きな見出しエリア（写真の背景＋キャッチコピー＋検索欄） -->
    <section class="hero">
        <div class="hero__inner">
            <h1 class="hero__title">毎日の料理が<br>もっと楽しくなる</h1>
            <span class="hero__line"></span>
            <p class="hero__lead">みんなのレシピで、<br>食卓をもっと豊かに。</p>

            <!-- 検索はデータを変えないので GET。URLが /recipes?q=カレー になる -->
            <form th:action="@{/recipes}" method="get" class="search-bar">
                <span class="material-symbols-rounded">search</span>
                <input type="search" name="q" th:value="${q}" placeholder="料理名または材料" maxlength="100">
                <!-- カテゴリを選んでいる状態で検索したら、カテゴリも一緒に送る -->
                <input th:if="${category != null and category != ''}" type="hidden" name="category" th:value="${category}">
                <button type="submit">検索</button>
            </form>
        </div>
    </section>

    <!-- ===== カテゴリから探す ===== -->
    <section>
        <div class="section-head">
            <h2 class="section-title">
                <span class="material-symbols-rounded">restaurant</span>カテゴリから探す
            </h2>
            <!-- カテゴリを選んでいるときだけ「すべて見る」を出す（押すと選択を解除する。検索語は残す） -->
            <a th:if="${category != null and category != ''}"
            th:href="${q != null and q != ''} ? @{/recipes(q=${q})} : @{/recipes}"
            class="section-link">すべて見る<span class="material-symbols-rounded">chevron_right</span></a>
        </div>

        <div class="category-cards">
            <!--
                選んでいるカード（c == category）を押したとき → カテゴリを外す（解除）
                それ以外のカードを押したとき → そのカテゴリで絞り込む
                どちらの場合も、検索語（q）があれば残す
            -->
            <a th:each="c : ${categories}"
            th:href="${c == category}
                        ? (${q != null and q != ''} ? @{/recipes(q=${q})} : @{/recipes})
                        : (${q != null and q != ''} ? @{/recipes(category=${c},q=${q})} : @{/recipes(category=${c})})"
            class="category-card" th:classappend="${c == category} ? 'is-active'"
            th:title="${c == category} ? 'もう一度押すと解除' : ${c} + 'で絞り込む'">
                <span class="category-card__icon" th:text="${categoryIcons.get(c)}">🍱</span>
                <span class="category-card__name" th:text="${c}">和食</span>
            </a>
        </div>
    </section>

    <!-- ===== レシピ一覧 ===== -->
    <section>
        <div class="section-head">
            <!-- 見出し：検索中 →「〇〇」の検索結果、カテゴリを選択中 → 〇〇のレシピ、それ以外 → 新着レシピ -->
            <h2 class="section-title">
                <span class="material-symbols-rounded">menu_book</span>
                <span th:text="${q != null and q != ''} ? '「' + ${q} + '」の検索結果'
                            : (${category != null and category != ''} ? ${category} + 'のレシピ' : '新着レシピ')">新着レシピ</span>
                <small class="text-muted" th:text="${#lists.size(recipes)} + '件'">20件</small>
            </h2>
        </div>

        <!-- 1件も無いとき -->
        <div th:if="${#lists.isEmpty(recipes)}" class="empty card">
            <span class="material-symbols-rounded empty__icon">search_off</span>
            <p>レシピが見つかりませんでした</p>
        </div>

        <div class="recipe-grid">
            <!--
                th:block：画面には何も出さない「入れ物」のタグ。
                th:each と th:replace を同じタグに書くと th:replace が先に動いてしまい、
                recipe がまだ無い状態で部品を読み込もうとするので、th:block で繰り返して、その中で読み込む
            -->
            <th:block th:each="recipe : ${recipes}">
                <article th:replace="~{fragments/recipe-card :: card(${recipe}, ${likeCounts.get(recipe.id)})}"></article>
            </th:block>
        </div>
    </section>

</body>
</html>
