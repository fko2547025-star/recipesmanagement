<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('レシピ一覧')}"></head>
<body>
    <!-- 共通ナビゲーション -->
    <div th:replace="~{fragments/header :: header}"></div>
    <!-- ヒーロー：ページ上部の大きな見出しエリア（写真の背景＋キャッチコピー＋検索欄） -->
    <section class="hero">
        <div class="hero__inner">
            <h1 class="hero__title">毎日の料理が<br>もっと楽しくなる</h1>
            <span class="hero__line"></span>
            <p class="hero__lead">みんなのレシピで、<br>食卓をもっと豊かに。</p>

            <!-- 検索はデータを変えないので GET。URLが /recipes?q=カレー になる -->
            <form th:action="@{/recipes}" method="get" class="search-bar">
                <span class="material-symbols-rounded">search</span>
                <input type="search" name="q" th:value="${q}" placeholder="料理名または材料" maxlength="100">
                <!-- カテゴリを選んでいる状態で検索したら、カテゴリも一緒に送る -->
                <input th:if="${category != null and category != ''}" type="hidden" name="category" th:value="${category}">
                <input type="hidden" name="sort" th:value="${sort}">
                <input type="hidden" name="feed" th:value="${feed}"><!-- ★ フォロー中のまま検索する -->
                <button type="submit">検索</button>
            </form>
        </div>
    </section>

    <!-- ===== 期限のお知らせ（ログイン中で、期限が近い食材があるときだけ） =====
         expiringCount は LoginUserAdvice が全画面に渡している（ヘッダーの数字と同じ）。
         「×」で閉じると、その日はもう出さない（ブラウザに今日の日付を覚えておく） -->
    <section th:if="${expiringCount > 0}" id="expiryNotice" class="is-hidden">
        <div class="alert alert--error banner">
            <span class="material-symbols-rounded">error</span>
            <span>期限が近い食材があります
                <strong th:text="'（3日以内：' + ${expiringCount} + '件）'">（3日以内：3件）</strong>
            </span>
            <a href="/ingredients#expiring" class="banner__link">確認する<span class="material-symbols-rounded">chevron_right</span></a>
            <button type="button" class="icon-btn" onclick="closeExpiryNotice()" title="今日はもう表示しない">
                <span class="material-symbols-rounded">close</span>
            </button>
        </div>
    </section>

    <!-- ===== カテゴリから探す ===== -->
    <section>
        <div class="section-head">
            <h2 class="section-title">
                <span class="material-symbols-rounded">restaurant</span>カテゴリから探す
            </h2>
            <!-- カテゴリを選んでいるときだけ「すべて見る」を出す（押すと選択を解除する。検索語・並び順・フォロー中は残す） -->
            <a th:if="${category != null and category != ''}"
               th:href="${q != null and q != ''} ? @{/recipes(q=${q},sort=${sort},feed=${feed})} : @{/recipes(sort=${sort},feed=${feed})}"
               class="section-link">すべて見る<span class="material-symbols-rounded">chevron_right</span></a>
        </div>

        <div class="category-cards">
            <!--
                選んでいるカード（c == category）を押したとき → カテゴリを外す（解除）
                それ以外のカードを押したとき → そのカテゴリで絞り込む
                どちらの場合も、検索語（q）・並び順・フォロー中は残す（★ feed を追加）
            -->
            <a th:each="c : ${categories}"
            th:href="${c == category}
                        ? (${q != null and q != ''} ? @{/recipes(q=${q},sort=${sort},feed=${feed})} : @{/recipes(sort=${sort},feed=${feed})})
                        : (${q != null and q != ''} ? @{/recipes(category=${c},q=${q},sort=${sort},feed=${feed})} : @{/recipes(category=${c},sort=${sort},feed=${feed})})"
            class="category-card" th:classappend="${c == category} ? 'is-active'"
            th:title="${c == category} ? 'もう一度押すと解除' : ${c} + 'で絞り込む'">
                <span class="category-card__icon" th:text="${categoryIcons.get(c)}">🍱</span>
                <span class="category-card__name" th:text="${c}">和食</span>
            </a>
        </div>
    </section>

    <!-- ===== レシピ一覧 ===== -->
    <section>
        <!-- ★ すべて／フォロー中の切り替え（ログイン中だけ）。カテゴリ・検索語・並び順は引き継ぐ -->
        <nav class="tabs feed-tabs" th:if="${loginUsername != null}">
            <a th:href="@{/recipes(category=${category},q=${q},sort=${sort},feed='all')}"
               th:classappend="${feed == 'all'} ? 'is-active'">すべて</a>
            <a th:href="@{/recipes(category=${category},q=${q},sort=${sort},feed='following')}"
               th:classappend="${feed == 'following'} ? 'is-active'">フォロー中</a>
        </nav>

        <!-- 見出し（左）と並び順（右）を、同じ行の左右の端に置く -->
        <div class="section-head">
            <h2 class="section-title">
                <span class="material-symbols-rounded">menu_book</span>
                <!-- 検索中 →「〇〇」の検索結果、カテゴリ選択中 → 〇〇のレシピ、
                     それ以外 → 並び順とフォロー中に合わせて（★ フォロー中の見出しを追加） -->
                <span th:text="${q != null and q != ''} ? '「' + ${q} + '」の検索結果'
                               : (${category != null and category != ''} ? ${category} + 'のレシピ'
                               : (${feed == 'following'} ? (${sort == 'popular'} ? 'フォロー中の人気レシピ' : 'フォロー中の新着レシピ')
                               : (${sort == 'popular'} ? '人気のレシピ' : '新着レシピ')))">新着レシピ</span>
                <small class="text-muted" th:text="${#lists.size(recipes)} + '件'">20件</small>
            </h2>

            <!-- 並び順（GET のフォーム）。選んだらすぐ送信する。カテゴリ・検索語・フォロー中は隠し項目で引き継ぐ -->
            <form th:action="@{/recipes}" method="get" class="sort-select">
                <input th:if="${category != null and category != ''}" type="hidden" name="category" th:value="${category}">
                <input th:if="${q != null and q != ''}" type="hidden" name="q" th:value="${q}">
                <input type="hidden" name="feed" th:value="${feed}"><!-- ★ -->
                <span class="material-symbols-rounded">sort</span>
                <select name="sort" onchange="this.form.submit()" aria-label="並び順">
                    <option value="new" th:selected="${sort == 'new'}">新着順</option>
                    <option value="popular" th:selected="${sort == 'popular'}">人気順</option>
                </select>
            </form>
        </div>

        <!-- 1件も無いとき（★ フォロー中なら、フォローの仕方を案内する） -->
        <div th:if="${#lists.isEmpty(recipes)}" class="empty card">
            <span class="material-symbols-rounded empty__icon" th:text="${feed == 'following'} ? 'group' : 'search_off'">search_off</span>
            <p th:text="${feed == 'following'} ? 'フォローしている人のレシピが見つかりませんでした' : 'レシピが見つかりませんでした'">レシピが見つかりませんでした</p>
            <p th:if="${feed == 'following'}" class="note">気になる投稿者のページで「フォローする」を押すと、ここに新着が並びます</p>
        </div>

        <div class="recipe-grid">
            <!--
                th:block：画面には何も出さない「入れ物」のタグ。
                th:each と th:replace を同じタグに書くと th:replace が先に動いてしまい、
                recipe がまだ無い状態で部品を読み込もうとするので、th:block で繰り返して、その中で読み込む
            -->
            <th:block th:each="recipe : ${recipes}">
                <article th:replace="~{fragments/recipe-card :: card(${recipe}, ${likeCounts.get(recipe.id)})}"></article>
            </th:block>
        </div>
    </section>

    <script>
        // ===== 期限のお知らせ：今日「×」で閉じていなければ表示する =====
        // localStorage はブラウザに小さな値を覚えておく仕組み。使えないブラウザでも表示はする
        const EXPIRY_KEY = 'expiryNoticeClosed';
        const today = new Date().toLocaleDateString('sv');   // 例：2026-11-19（sv は「年-月-日」の形になる）

        function closeExpiryNotice() {
            document.getElementById('expiryNotice').classList.add('is-hidden');
            try { localStorage.setItem(EXPIRY_KEY, today); } catch (e) { /* 覚えられなくても閉じるだけ */ }
        }

        (function () {
            const notice = document.getElementById('expiryNotice');
            if (!notice) return;                                  // 期限が近い食材が無いときは何もしない
            let closedDay = null;
            try { closedDay = localStorage.getItem(EXPIRY_KEY); } catch (e) { /* 読めなければ表示する */ }
            if (closedDay !== today) {
                notice.classList.remove('is-hidden');
            }
        })();
    </script>
</body>
</html>
