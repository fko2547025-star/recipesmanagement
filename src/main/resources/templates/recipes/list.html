<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('レシピ一覧')}"></head>
<body>
    <!-- 共通ナビゲーション -->
    <div th:replace="~{fragments/header :: header}"></div>

    <h1>レシピ一覧</h1>

    <!-- ===== カテゴリ・料理名・材料で検索（データを変えないので GET） ===== -->
    <form th:action="@{/recipes}" method="get">
        カテゴリ：
        <select name="category" onchange="this.form.submit()">
            <option value="">すべて</option>
            <option th:each="c : ${categories}"
                    th:value="${c}" th:text="${c}"
                    th:selected="${c == category}">肉</option>
        </select>

        <!-- type="search"：検索用の入力欄（スマホでは「検索」キーが出る、入力を消す × が付くブラウザもある） -->
        <input type="search" name="q" th:value="${q}" placeholder="料理名または材料" maxlength="100">
        <button type="submit">検索</button>

        <!-- 条件があるときだけ「解除」リンク -->
        <a th:if="${(q != null and q != '') or (category != null and category != '')}"
           href="/recipes">条件を解除</a>
    </form>

    <!-- 検索したときは、件数を表示 -->
    <p th:if="${q != null and q != ''}"
       th:text="'「' + ${q} + '」の検索結果：' + ${#lists.size(recipes)} + '件'">
        「豚」の検索結果：8件
    </p>

    <!-- レシピが1件も無いとき -->
    <!-- #lists.isEmpty()：Thymeleaf の便利機能。リストが空なら true -->
    <p th:if="${#lists.isEmpty(recipes)}">レシピがありません</p>

    <!-- ===== レシピ一覧 ===== -->
    <table border="1" th:unless="${#lists.isEmpty(recipes)}">
        <thead>
            <tr>
                <th>写真</th>
                <th>タイトル</th>
                <th>カテゴリ</th>
                <th>投稿者</th>
                <th>投稿日</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="recipe : ${recipes}">
                <td>
                    <img th:if="${recipe.imagePath}"
                         th:src="@{/uploads/{file}(file=${recipe.imagePath})}"
                         th:alt="${recipe.title}" style="width: 80px">
                </td>                
                <!-- タイトルをクリックすると詳細画面へ -->
                <td><a th:href="@{/recipes/{id}(id=${recipe.id})}" th:text="${recipe.title}">豚の生姜焼き</a></td>
                <td th:text="${recipe.category}">肉</td>
                <!-- recipe.user.username：レシピ → 投稿者 → ユーザー名 とたどっている -->
                <td th:text="${recipe.user.username}">taro</td>
                <!-- #temporals.format()：日時を好きな形に整えて表示する -->
                <td th:text="${#temporals.format(recipe.createdAt, 'yyyy/MM/dd')}">2026/10/20</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
