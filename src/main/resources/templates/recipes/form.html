<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${recipeId == null} ? 'レシピを投稿' : 'レシピを編集')}"></head>
<body>
    <!-- 共通ナビゲーション -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container container--narrow">
        <h1 class="page-title">
            <span class="material-symbols-rounded">edit_note</span>
            <span th:text="${recipeId == null} ? 'レシピを投稿' : 'レシピを編集'">レシピを投稿</span>
        </h1>

        <!-- ===== エラーメッセージ ===== -->
        <div th:if="${errors != null}" class="alert alert--error">
            <span class="material-symbols-rounded">error</span>
            <ul class="alert__list">
                <li th:each="e : ${errors}" th:text="${e}">エラー</li>
            </ul>
        </div>

        <!--
            送信先：投稿なら POST /recipes、編集なら POST /recipes/{id}
            enctype="multipart/form-data"：写真（ファイル）を送るために必要
        -->
        <form th:action="${recipeId == null} ? @{/recipes} : @{/recipes/{id}(id=${recipeId})}"
              th:object="${form}" method="post" enctype="multipart/form-data" class="card">

            <!-- ===== 上の段：写真（左）＋ 基本情報（右） ===== -->
            <div class="recipe-form__top">
                <div>
                    <!--
                        写真の選択枠。label の中に、透明にした input type="file" を枠いっぱいに重ねている。
                        → 枠のどこを押してもファイル選択が開き、写真をドラッグ＆ドロップしても選べる
                    -->
                    <label class="photo-drop">
                        <!-- プレビュー。編集で今の写真があれば、最初から表示する -->
                        <img id="photoPreview" alt=""
                             th:src="${currentImage != null} ? @{/uploads/{file}(file=${currentImage})} : ''"
                             th:classappend="${currentImage == null} ? 'is-hidden'">
                        <!-- 写真が無いときの案内 -->
                        <span id="photoPlaceholder" class="photo-drop__placeholder"
                              th:classappend="${currentImage != null} ? 'is-hidden'">
                            <span class="material-symbols-rounded">photo_camera</span>
                            写真をアップロード
                            <small>またはドラッグ＆ドロップ</small>
                        </span>
                        <input type="file" name="image" accept="image/jpeg,image/png,image/webp,image/gif"
                               onchange="previewPhoto(this)">
                    </label>
                    <small class="field-hint">JPEG・PNG・WebP・GIF、5MBまで</small>
                    <small th:if="${errors != null}" class="field-hint text-danger">※写真を選んでいた場合は、もう一度選んでください</small>
                    <!-- チェックすると removeImage=true が送られる。チェックしないと何も送られない -->
                    <label th:if="${currentImage != null}" class="check">
                        <input type="checkbox" name="removeImage" value="true"> 写真を削除する
                    </label>
                </div>

                <div>
                    <div class="form-field">
                        <label for="title">料理名</label>
                        <input type="text" id="title" th:field="*{title}" maxlength="100" required
                               placeholder="例：豚の生姜焼き">
                    </div>
                    <div class="form-field">
                        <label for="category">カテゴリ</label>
                        <select id="category" th:field="*{category}" required>
                            <!-- value="" の選択肢は「まだ選んでいない」。required なので、これのままだと送れない -->
                            <option value="">選択してください</option>
                            <option th:each="c : ${categories}" th:value="${c}"
                                    th:text="${categoryIcons.get(c)} + ' ' + ${c}">🍱 和食</option>
                        </select>
                    </div>
                    <div class="form-field">
                        <label for="servings">何人分</label>
                        <div class="inline-field">
                            <input type="number" id="servings" th:field="*{servings}" min="1" max="20" required class="input-short">
                            <span>人分</span>
                        </div>
                        <small class="field-hint">材料の分量は、この人数分で入力してください</small>
                    </div>
                    <div class="form-field">
                        <label for="description">ひとこと（任意）</label>
                        <textarea id="description" th:field="*{description}" rows="2" maxlength="500"
                                  placeholder="例：ご飯がすすむ定番おかず。15分で作れます"></textarea>
                    </div>
                </div>
            </div>

            <!-- ===== 材料 ===== -->
            <h2 class="form-section-title">材料</h2>
            <div id="ingredient-rows" class="ingredient-rows">
                <!-- st.index：今が何番目か。分量と単位は同じ番号の値を表示する -->
                <div class="ingredient-row" th:each="name, st : ${form.ingredientNames}">
                    <input type="text" name="ingredientNames" th:value="${name}" maxlength="100"
                           placeholder="材料名（例：豚ロース）">
                    <input type="number" name="ingredientQuantities" th:value="${form.ingredientQuantities[st.index]}"
                           step="any" min="0" placeholder="分量">
                    <input type="text" name="ingredientUnits" th:value="${form.ingredientUnits[st.index]}"
                           list="units" maxlength="20" placeholder="単位">
                    <button type="button" class="icon-btn icon-btn--danger" onclick="removeRow(this)" title="この材料を削除">
                        <span class="material-symbols-rounded">delete</span>
                    </button>
                </div>
            </div>
            <button type="button" class="btn btn--outline btn--sm btn--add" onclick="addRow('ingredient-rows')">
                <span class="material-symbols-rounded">add</span>材料を追加
            </button>
            <small class="field-hint">「少々」「適量」のときは、分量を空欄にして単位に入力してください</small>

            <datalist id="units">
                <option value="g"></option>
                <option value="ml"></option>
                <option value="個"></option>
                <option value="本"></option>
                <option value="枚"></option>
                <option value="大さじ"></option>
                <option value="小さじ"></option>
                <option value="かけ"></option>
                <option value="少々"></option>
                <option value="適量"></option>
            </datalist>

            <!-- ===== 作り方（1行が1手順。番号の丸はCSSが自動で付ける） ===== -->
            <h2 class="form-section-title">作り方</h2>
            <ol id="step-rows" class="step-rows">
                <!-- どの行も name="steps" → 送信すると、上から順に List<String> steps に入る -->
                <li class="step-row" th:each="step : ${form.steps}">
                    <textarea name="steps" rows="2" maxlength="1000" placeholder="手順を入力（例：玉ねぎを薄切りにする）"
                              th:text="${step}"></textarea>
                    <button type="button" class="icon-btn icon-btn--danger" onclick="removeRow(this)" title="この手順を削除">
                        <span class="material-symbols-rounded">delete</span>
                    </button>
                </li>
            </ol>
            <button type="button" class="btn btn--outline btn--sm btn--add" onclick="addRow('step-rows')">
                <span class="material-symbols-rounded">add</span>手順を追加
            </button>

            <!-- ===== 送信・戻る ===== -->
            <div class="form-actions">
                <button type="submit" class="btn--wide">
                    <span class="material-symbols-rounded">send</span>
                    <span th:text="${recipeId == null} ? '投稿する' : '更新する'">投稿する</span>
                </button>
                <!-- 戻り先：投稿ならレシピ一覧、編集ならそのレシピの詳細 -->
                <a th:if="${recipeId == null}" href="/recipes" class="btn btn--outline">キャンセル</a>
                <a th:if="${recipeId != null}" th:href="@{/recipes/{id}(id=${recipeId})}" class="btn btn--outline">編集をやめる</a>
            </div>
        </form>
    </main>

    <script>
        // ===== 行を追加する（材料・作り方で共通） =====
        // id で指定した入れ物の1行目をコピーして、中身を空にしてから一番下に足す
        function addRow(id) {
            const box = document.getElementById(id);
            const row = box.firstElementChild.cloneNode(true);    // true：中の要素ごとコピー
            row.querySelectorAll('input, textarea').forEach(el => el.value = '');
            box.appendChild(row);
            row.querySelector('input, textarea').focus();          // 足した行にカーソルを移す
        }

        // ===== 行を削除する（材料・作り方で共通。最後の1行は消さずに中身だけ空にする） =====
        function removeRow(button) {
            // closest：押したボタンから親をたどって、一番近い「行」を探す
            const row = button.closest('.ingredient-row, .step-row');
            if (row.parentElement.children.length > 1) {
                row.remove();
            } else {
                row.querySelectorAll('input, textarea').forEach(el => el.value = '');
            }
        }

        // ===== 選んだ写真をその場で表示する（＋5MBのチェック） =====
        function previewPhoto(input) {
            const file = input.files[0];
            if (!file) {
                return;                                  // 選択をやめたときは何もしない
            }
            if (file.size > 5 * 1024 * 1024) {
                alert('写真は5MB以下のものを選んでください');
                input.value = '';
                return;
            }
            // URL.createObjectURL：選んだファイルを、ブラウザの中だけで見られる仮のURLにする（まだ送信はしない）
            const img = document.getElementById('photoPreview');
            img.src = URL.createObjectURL(file);
            img.classList.remove('is-hidden');
            document.getElementById('photoPlaceholder').classList.add('is-hidden');
        }
    </script>
</body>
</html>
