<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>コメントを編集</title>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <h1>コメントを編集</h1>
    <!-- どのレシピへのコメントか -->
    <p>レシピ：<a th:href="@{/recipes/{id}(id=${comment.recipe.id})}" th:text="${comment.recipe.title}">豚の生姜焼き</a></p>

    <p th:if="${error}" th:text="${error}" style="color: red">エラー</p>

    <form th:action="@{/comments/{id}(id=${comment.id})}" method="post">
        <!-- textarea は value ではなく、タグの中身に値を入れる（th:text） -->
        <textarea name="content" rows="4" cols="50" th:attr="maxlength=${maxLength}" required
                  th:text="${content}"></textarea>
        <br>
        <button type="submit">更新する</button>
    </form>

    <a th:href="@{/recipes/{id}(id=${comment.recipe.id})} + '#comments'">編集をやめる</a>
</body>
</html>
