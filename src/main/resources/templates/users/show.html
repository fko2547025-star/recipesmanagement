<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${user.displayName} + 'さんのレシピ')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container">
        <a href="/recipes" class="back-link">
            <span class="material-symbols-rounded">arrow_back</span>レシピ一覧に戻る
        </a>

        <!-- ===== プロフィール（左）と数字のまとめ（右）。マイページと同じ部品 ===== -->
        <div class="mypage-top">
            <section class="card profile-card">
                <span th:replace="~{fragments/avatar :: avatar(${user}, 'avatar--xl')}"></span>
                <p class="profile-card__name" th:text="${user.displayName}">じろう</p>
                <p class="profile-card__id" th:text="'@' + ${user.username}">@jiro</p>

                <!-- フォロワー・フォロー中の人数（押すと一覧へ） -->
                <p class="follow-counts">
                    <a th:href="@{/users/{id}/followers(id=${user.id})}">
                        <strong th:text="${followerCount}">12</strong>フォロワー
                    </a>
                    <a th:href="@{/users/{id}/following(id=${user.id})}">
                        <strong th:text="${followingCount}">5</strong>フォロー中
                    </a>
                </p>

                <!-- フォローボタン（データが変わるので POST）。押すたびに、フォローする／やめるが切り替わる -->
                <form th:if="${userMode}" th:action="@{/users/{id}/follow(id=${user.id})}" method="post">
                    <!-- フォロー中なら枠だけのボタンにする（いいねボタンと同じ考え方） -->
                    <button type="submit" class="btn" th:classappend="${following} ? 'btn--outline'">
                        <span class="material-symbols-rounded" th:text="${following} ? 'how_to_reg' : 'person_add'">person_add</span>
                        <span th:text="${following} ? 'フォロー中' : 'フォローする'">フォローする</span>
                    </button>
                </form>
                <a th:if="${loginUsername == null}" href="/login" class="btn btn--outline">
                    <span class="material-symbols-rounded">person_add</span>ログインしてフォロー
                </a>
            </section>

            <section class="card stats-card">
                <h2 class="stats-card__title" th:text="${user.displayName} + 'さんの投稿・いいね'">じろうさんの投稿・いいね</h2>
                <!-- 数字は2つなので、2列にする（stats--2） -->
                <div class="stats stats--2">
                    <div class="stat">
                        <span class="material-symbols-rounded">edit</span>
                        <span class="stat__label">投稿数</span>
                        <strong class="stat__value" th:text="${postCount}">5</strong>
                    </div>
                    <div class="stat">
                        <span class="material-symbols-rounded is-filled">favorite</span>
                        <span class="stat__label">もらったいいね</span>
                        <strong class="stat__value" th:text="${receivedLikeCount}">12</strong>
                    </div>
                </div>

                <!-- ===== その人の料理レベル（マイページと同じカード。ポイントの増やし方の説明は出さない） ===== -->
                <div class="level" th:classappend="'rank--' + ${level.rank}">
                    <div class="level__head">
                        <span class="level__icon">
                            <svg th:replace="~{fragments/rank :: emblem(${level}, 44)}"></svg>
                        </span>
                        <span class="level__lv" th:text="'Lv.' + ${level.level}">Lv.2</span>
                        <strong class="level__title" th:text="${level.title}">家庭の料理人</strong>
                        <span class="level__points" th:text="${level.points} + 'pt'">56pt</span>
                    </div>
                    <div class="level__bar">
                        <span class="level__fill" th:style="'width: ' + ${level.progressPercent} + '%'"></span>
                    </div>
                    <small class="level__next" th:if="${!level.max}"
                           th:text="'次の「' + ${level.nextTitle} + '」まで あと ' + ${level.pointsToNext} + 'pt'">次の「頼れるシェフ」まで あと 24pt</small>
                    <small class="level__next" th:if="${level.max}">最高レベルに到達しました！</small>
                </div>
            </section>
        </div>

        <!-- ===== 投稿したレシピ ===== -->
        <div class="section-head">
            <h2 class="section-title">
                <span class="material-symbols-rounded">menu_book</span>
                <span th:text="${user.displayName} + 'さんのレシピ'">じろうさんのレシピ</span>
                <small class="text-muted" th:text="${#lists.size(recipes)} + '件'">5件</small>
            </h2>
        </div>

        <div th:if="${#lists.isEmpty(recipes)}" class="empty card">
            <span class="material-symbols-rounded empty__icon">menu_book</span>
            <p>まだレシピを投稿していません</p>
        </div>

        <!-- レシピカードの部品を使い回す（ホーム・マイページと同じ） -->
        <div class="recipe-grid">
            <th:block th:each="recipe : ${recipes}">
                <article th:replace="~{fragments/recipe-card :: card(${recipe}, ${likeCounts.get(recipe.id)})}"></article>
            </th:block>
        </div>
    </main>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
