<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('ランキング')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container container--narrow">
        <h1 class="page-title">
            <span class="material-symbols-rounded is-filled">workspace_premium</span>ランキング
        </h1>

        <!-- 期間の切り替え。データを変えないので、ただのリンク（GET）。選んでいる期間に is-active -->
        <nav class="tabs tabs--wide">
            <a th:href="@{/ranking(period='week')}"  th:classappend="${period == 'week'}  ? 'is-active'">週間</a>
            <a th:href="@{/ranking(period='month')}" th:classappend="${period == 'month'} ? 'is-active'">月間</a>
            <a th:href="@{/ranking}"                 th:classappend="${period == 'all'}   ? 'is-active'">累計</a>
        </nav>

        <!-- この期間に1件もいいねが無いとき -->
        <div th:if="${#lists.isEmpty(items)}" class="empty card">
            <span class="material-symbols-rounded empty__icon">sentiment_neutral</span>
            <p>この期間のいいねはまだありません</p>
        </div>

        <!-- ol：順番に意味のあるリスト（順位なので ul ではなく ol） -->
        <ol class="ranking-list card" th:unless="${#lists.isEmpty(items)}">
            <!-- 1〜3位には is-top（背景を明るく）と rank-1〜3（王冠の色）のクラスを付ける -->
            <li th:each="item : ${items}" class="ranking-item"
                th:classappend="${item.rank <= 3 ? 'is-top rank-' + item.rank : ''}">

                <!-- 順位：1〜3位は王冠の上に数字を重ねる。4位以下は数字だけ -->
                <span class="rank-badge">
                    <!-- 王冠（SVGで描く）。fill="currentColor"：CSSの color の色で塗る → 順位ごとに金・銀・銅に変えられる -->
                    <svg th:if="${item.rank <= 3}" class="rank-badge__crown" viewBox="0 0 48 40" aria-hidden="true">
                        <!-- 王冠の本体：左下 → 左の山 → 谷 → 真ん中の山 → 谷 → 右の山 → 右下 → 戻る -->
                        <path d="M6 14 L15 23 L24 9 L33 23 L42 14 L39 34 Q39 36 37 36 L11 36 Q9 36 9 34 Z"
                            fill="currentColor" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
                        <!-- 山の先の丸い玉 -->
                        <circle cx="6"  cy="12" r="3.5" fill="currentColor"/>
                        <circle cx="24" cy="7"  r="3.5" fill="currentColor"/>
                        <circle cx="42" cy="12" r="3.5" fill="currentColor"/>
                    </svg>
                    <span class="rank-badge__num" th:text="${item.rank}">1</span>
                </span>

                <!-- 写真（無ければカテゴリの絵文字） -->
                <a th:href="@{/recipes/{id}(id=${item.recipe.id})}" class="ranking-item__photo">
                    <img th:if="${item.recipe.imagePath}" th:src="@{/uploads/{file}(file=${item.recipe.imagePath})}"
                         th:alt="${item.recipe.title}" loading="lazy">
                    <span th:unless="${item.recipe.imagePath}" class="photo-placeholder"
                          th:text="${item.recipe.categoryIcon}">🍽️</span>
                </a>

                <!-- レシピ名・カテゴリ・投稿者 -->
                <div class="ranking-item__body">
                    <a th:href="@{/recipes/{id}(id=${item.recipe.id})}" class="ranking-item__title"
                       th:text="${item.recipe.title}">親子丼</a>
                    <small class="text-muted"
                           th:text="${item.recipe.categoryIcon} + ' ' + ${item.recipe.category} + ' ・ ' + ${item.recipe.user.username}">
                        🍜 ご飯・麺 ・ jiro
                    </small>
                </div>

                <!-- いいね数 -->
                <span class="like-count">
                    <span class="material-symbols-rounded is-filled">favorite</span>
                    <strong th:text="${item.likeCount}">4</strong>
                </span>
            </li>
        </ol>
    </main>
</body>
</html>
