<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('コメント（管理者）')}"></head>
<body class="admin-page">
    <header th:replace="~{fragments/admin :: header}"></header>
    <main class="admin-shell">
        <nav th:replace="~{fragments/admin :: sidebar('comments')}"></nav>
        <div class="admin-main">
            <h1 class="page-title"><span class="material-symbols-rounded">chat</span>コメント</h1>
            <th:block th:replace="~{fragments/admin :: messages}"></th:block>

            <form action="/admin/comments" method="get" class="admin-search">
                <input type="search" name="q" th:value="${q}" placeholder="内容・投稿者のユーザーIDで検索">
                <button type="submit" class="btn--sm">検索</button>
            </form>
            <p class="note" th:text="'新しい順に最大 ' + ${limit} + ' 件を表示しています'">新しい順に最大100件</p>

            <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                    <tr><th>内容</th><th>投稿者</th><th>レシピ</th><th>日時</th><th>通報</th><th>操作</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${comments}">
                        <td class="admin-text">
                            <span th:if="${c.cookedReport}" class="admin-badge">作りました</span>
                            <span th:if="${c.hasImage}" class="material-symbols-rounded" title="写真あり">photo</span>
                            <span th:text="${c.content}">おいしかった</span>
                        </td>
                        <td th:text="'@' + ${c.author}">@taro</td>
                        <td><a th:href="@{/recipes/{id}(id=${c.recipeId})} + '#comments'" target="_blank" th:text="${c.recipeTitle}">カレー</a></td>
                        <td class="text-muted" th:text="${c.createdAt != null} ? ${#temporals.format(c.createdAt, 'MM/dd HH:mm')} : ''">11/20</td>
                        <td th:text="${c.reportCount}" th:classappend="${c.reportCount > 0} ? 'text-danger'">0</td>
                        <td class="admin-actions">
                            <form th:action="@{/admin/comments/{id}/delete(id=${c.id})}" method="post"
                                  onsubmit="return confirm('このコメントを削除しますか？');">
                                <button type="submit" class="btn--danger btn--sm">削除</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
            </div>
            <p th:if="${#lists.isEmpty(comments)}" class="note">見つかりませんでした。</p>
        </div>
    </main>
</body>
</html>
