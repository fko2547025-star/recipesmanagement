<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('作った')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container container--narrow">
        <!-- 8Bで変えたとおり、やめたら献立の詳細に戻る -->
        <a th:href="@{/meal-plans/{id}(id=${plan.id})}" class="back-link">
            <span class="material-symbols-rounded">arrow_back</span>献立の詳細に戻る
        </a>

        <h1 class="page-title" th:text="'「' + ${plan.recipe.title} + '」を作りましたか？'">「豚の生姜焼き」を作りましたか？</h1>
        <p class="plan-detail__when">
            <span class="material-symbols-rounded" th:text="${plan.mealIcon}">dark_mode</span>
            <span th:text="${#temporals.format(plan.planDate, 'yyyy/M/d(E)')} + ' ' + ${plan.mealType}">2026/11/4(水) 夜</span>
        </p>

        <section class="card section-card">
            <p>「作った」にすると、食材管理の在庫が次のように減ります（期限が近い在庫から使います）。</p>

            <!-- table-wrap：スマホで表がはみ出したら、表だけ横にスクロールさせる -->
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr><th>材料</th><th>必要</th><th>減らす在庫</th><th>備考</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="line : ${lines}">
                            <td th:text="${line.name}">豚ロース</td>
                            <td th:text="${line.neededText}">200g</td>
                            <td>
                                <!-- 減らす在庫が無いとき -->
                                <span th:if="${#lists.isEmpty(line.deductions)}" class="text-muted">-</span>
                                <!-- 減らす在庫（複数のこともある） -->
                                <div th:each="d : ${line.deductions}">
                                    <span th:text="${d.stockName}">豚ロース</span>
                                    <small class="text-muted" th:if="${d.expiryDate != null}"
                                           th:text="'（期限' + ${#temporals.format(d.expiryDate, 'M/d')} + '）'">（期限11/5）</small>
                                    <strong th:text="${d.beforeText} + ' → ' + ${d.afterText}">300g → 100g</strong>
                                </div>
                            </td>
                            <td class="text-danger" th:text="${line.note}">在庫なし</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 在庫を減らすので POST。押したらボタンを無効にして、二重送信を防ぐ -->
            <form th:action="@{/meal-plans/{id}/cook(id=${plan.id})}" method="post" class="form-actions"
                  onsubmit="this.querySelector('button').disabled = true;">
                <button type="submit" class="btn--wide">
                    <span class="material-symbols-rounded">check</span>作った（在庫を減らす）
                </button>
                <a th:href="@{/meal-plans/{id}(id=${plan.id})}" class="btn btn--outline">やめる</a>
            </form>
        </section>
    </main>
</body>
</html>
