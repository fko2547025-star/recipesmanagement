<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('献立')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="container container--wide">
        <div class="page-head">
            <h1 class="page-title">
                <span class="material-symbols-rounded">calendar_month</span>献立
            </h1>
            <a href="/meal-plans/new" class="btn">
                <span class="material-symbols-rounded">add</span>献立を追加
            </a>
        </div>

        <!-- 「作った」の結果（フラッシュ属性。作った直後の1回だけ表示される） -->
        <div th:if="${cookTitle != null}" class="alert alert--success">
            <span class="material-symbols-rounded">check_circle</span>
            <div>
                <strong th:text="${cookTitle}">「豚の生姜焼き」を作りました</strong>
                <ul class="alert__list">
                    <li th:each="m : ${cookMessages}" th:text="${m}">豚ロース：300g → 100g</li>
                </ul>
                <a href="/ingredients">食材管理を見る</a>
            </div>
        </div>

        <!-- ===== 週の移動 ===== -->
        <div class="week-nav">
            <a th:href="@{/meal-plans(date=${prevWeek})}" class="icon-btn" title="前の週">
                <span class="material-symbols-rounded">chevron_left</span></a>
            <strong th:text="${#temporals.format(monday, 'yyyy/M/d')} + ' 〜 ' + ${#temporals.format(sunday, 'M/d')}">2026/11/2 〜 11/8</strong>
            <a th:href="@{/meal-plans(date=${nextWeek})}" class="icon-btn" title="次の週">
                <span class="material-symbols-rounded">chevron_right</span></a>
            <a href="/meal-plans" class="btn btn--outline btn--sm">今週</a>
            <a th:href="@{/meal-plans/shopping(date=${monday})}" class="btn btn--outline btn--sm week-nav__shopping">
                <span class="material-symbols-rounded">shopping_cart</span>この週の買い物リスト
            </a>
        </div>

        <!--
            ===== 1週間（月〜日の7列） =====
            week：DayPlans のリスト。1日ごとに slots（朝・昼・夜 → 献立のリスト）を持っている
        -->
        <div class="week">
            <section th:each="day : ${week}" class="day" th:classappend="${day.today} ? 'is-today'">
                <header class="day__head">
                    <span class="day__date" th:text="${#temporals.format(day.date, 'M/d')}">11/4</span>
                    <span class="day__dow" th:text="'(' + ${#temporals.format(day.date, 'E')} + ')'">(水)</span>
                </header>

                <!-- Map を th:each で回すと、slot.key（朝・昼・夜）と slot.value（献立のリスト）で取り出せる -->
                <div th:each="slot : ${day.slots}" class="slot">
                    <div class="slot__head">
                        <span class="slot__label">
                            <span class="material-symbols-rounded" th:text="${mealIcons.get(slot.key)}">dark_mode</span>
                            <span th:text="${slot.key}">夜</span>
                        </span>
                        <!-- この日・この区分を選んだ状態で、登録画面を開く（8Aで newForm に足した mealType を使う） -->
                        <a th:href="@{/meal-plans/new(date=${day.date},mealType=${slot.key})}" class="slot__add"
                           th:title="${slot.key} + 'の献立を追加'">
                            <span class="material-symbols-rounded">add</span></a>
                    </div>

                    <div th:each="plan : ${slot.value}" class="plan" th:classappend="${plan.cooked} ? 'is-cooked'">
                        <!-- 名前と写真のどちらを押しても、献立の詳細（変更・削除）へ -->
                        <a th:href="@{/meal-plans/{id}(id=${plan.id})}" class="plan__link">
                            <span class="plan__name" th:text="${plan.displayName}">カレーライス</span>
                            <span class="plan__photo">
                                <img th:if="${plan.recipe != null and plan.recipe.imagePath != null}"
                                     th:src="@{/uploads/{file}(file=${plan.recipe.imagePath})}"
                                     th:alt="${plan.displayName}" loading="lazy">
                                <span th:unless="${plan.recipe != null and plan.recipe.imagePath != null}"
                                      class="photo-placeholder"
                                      th:text="${plan.recipe != null} ? ${plan.recipe.categoryIcon} : '📝'">📝</span>
                            </span>
                        </a>

                        <!-- 写真の下：作った献立には印、まだならボタン（レシピのある献立だけ） -->
                        <span th:if="${plan.cooked}" class="plan__done">
                            <span class="material-symbols-rounded">check_circle</span>作った
                        </span>
                        <a th:if="${plan.recipe != null and !plan.cooked}"
                           th:href="@{/meal-plans/{id}/cook(id=${plan.id})}" class="btn btn--sm plan__cook">作った</a>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script>
        // スマホで横スクロールになるときは、今日の列が見えるところまで自動でスクロールする
        const today = document.querySelector('.day.is-today');
        if (today) {
            today.scrollIntoView({ inline: 'center', block: 'nearest' });
        }
    </script>
</body>
</html>
