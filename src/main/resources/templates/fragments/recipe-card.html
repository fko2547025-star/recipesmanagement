<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
        レシピカード（一覧・マイページ・ユーザーページで使う）。
        写真が主役：写真の左下に調理時間・難易度のバッジ、右上に ♡（その場でいいね）を重ねる。
        likedRecipeIds（いいね済みのレシピの id）は LoginUserAdvice が全画面に渡している
    -->
    <article th:fragment="card(recipe, likeCount)" class="recipe-card">
    <!-- 写真・料理名・一言（押すとレシピの詳細へ） -->
    <a th:href="@{/recipes/{id}(id=${recipe.id})}" class="recipe-card__link">
        <div class="recipe-card__photo">
            <img th:if="${recipe.imagePath}" th:src="@{/uploads/{file}(file=${recipe.imagePath})}"
                 th:alt="${recipe.title}" loading="lazy">
            <span th:unless="${recipe.imagePath}" class="photo-placeholder"
                  th:text="${recipe.categoryIcon}">🍽️</span>

            <!-- 写真の左下のバッジ：調理時間・難易度（どちらも無ければカテゴリ） -->
            <div class="recipe-card__badges">
                <span class="photo-badge" th:if="${recipe.cookingTime != null}">
                    <span class="material-symbols-rounded">schedule</span><span th:text="${recipe.cookingTime} + '分'">15分</span>
                </span>
                <span class="photo-badge" th:if="${recipe.difficulty != null}">
                    <span class="material-symbols-rounded">local_fire_department</span><span th:text="${recipe.difficulty}">かんたん</span>
                </span>
                <span class="photo-badge" th:if="${recipe.cookingTime == null and recipe.difficulty == null}"
                      th:text="${recipe.categoryIcon} + ' ' + ${recipe.category}">🍝 洋食</span>
            </div>
        </div>

        <div class="recipe-card__body">
            <h3 class="recipe-card__title" th:text="${recipe.title}">肉じゃが</h3>
            <p th:if="${recipe.description != null and recipe.description != ''}"
               class="recipe-card__desc" th:text="${recipe.description}">外はカリッ、中はふわっと！</p>
        </div>
    </a>

    <!-- 写真の右上の ♡。ログイン中は押すとその場でいいね（/js/like.js）、ログインしていなければログイン画面へ。
         <a> の中に <button> は入れられないので、カードの中に重ねて置く -->
    <button th:if="${loginUsername != null}" type="button" class="card-like"
            th:with="liked=${likedRecipeIds.contains(recipe.id)}"
            th:classappend="${liked} ? 'is-liked'"
            th:attr="data-url=@{/recipes/{id}/like(id=${recipe.id})},data-recipe=${recipe.id},aria-pressed=${liked}"
            th:title="${liked} ? 'いいねを取り消す' : 'いいね'">
        <span class="material-symbols-rounded">favorite</span>
    </button>
    <a th:unless="${loginUsername != null}" href="/login" class="card-like" title="ログインしていいね">
        <span class="material-symbols-rounded">favorite</span>
    </a>

    <!-- 下：投稿者（押すと投稿者のページへ）といいね数 -->
    <div class="recipe-card__meta">
        <a th:href="@{/users/{id}(id=${recipe.user.id})}" class="mini-user">
            <span th:replace="~{fragments/avatar :: avatar(${recipe.user}, 'avatar--sm')}"></span>
            <span th:text="${recipe.user.displayName}">はるお</span>
        </a>
        <span class="like-mini">
            <span class="material-symbols-rounded">favorite</span>
            <span th:attr="data-like-count=${recipe.id}" th:text="${likeCount ?: 0}">0</span>
        </span>
    </div>
</article>
</body>
</html>
