<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>食材一覧</title>
</head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>
    
    <h1>食材一覧</h1>
    <!-- ===== 期限が近い食材（3日以内・期限切れを含む） ===== -->
    <div th:if="${!#lists.isEmpty(expiring)}" style="border: 1px solid orange; padding: 8px">
        <h2>期限が近い食材（3日以内）</h2>
        <ul>
            <li th:each="item : ${expiring}">
                <span th:text="${item.name}">豚ロース</span>
                <span th:text="${#temporals.format(item.expiryDate, 'M/d')}">11/5</span>
                <span th:if="${item.expired}" style="color: red">（期限切れ）</span>
                <!-- この食材の名前で、レシピ一覧を材料検索する -->
                <a th:href="@{/recipes(ingredient=${item.name})}">この食材を使うレシピ</a>
            </li>
        </ul>

        <h3>期限が近い食材を使えるレシピ</h3>
        <ul th:if="${!#lists.isEmpty(suggestions)}">
            <li th:each="s : ${suggestions}">
                <a th:href="@{/recipes/{id}(id=${s.recipe.id})}" th:text="${s.recipe.title}">親子丼</a>
                <small th:text="'使える食材：' + ${s.usableText}">使える食材：豚ロース、卵</small>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(suggestions)}">
            これらの食材を使うレシピはまだありません。<a href="/recipes/new">レシピを投稿する</a>
        </p>
    </div>

    <a href="/ingredients/new">＋ 食材を登録</a>

    <form th:action="@{/ingredients}" method="get">
        カテゴリ：
        <select name="category" onchange="this.form.submit()">
            <option value="">すべて</option>
            <option value="肉" th:selected="${category == '肉'}">肉</option>
            <option value="魚" th:selected="${category == '魚'}">魚</option>
            <option value="野菜" th:selected="${category == '野菜'}">野菜</option>
            <option value="調味料" th:selected="${category == '調味料'}">調味料</option>
            <option value="その他" th:selected="${category == 'その他'}">その他</option>
        </select>

        並び順：
        <select name="sort" onchange="this.form.submit()">
            <option value="expiry" th:selected="${sort == 'expiry'}">期限が近い順</option>
            <option value="expiryDesc" th:selected="${sort == 'expiryDesc'}">期限が遠い順</option>
            <option value="name" th:selected="${sort == 'name'}">名前順</option>
            <option value="newest" th:selected="${sort == 'newest'}">新しく登録した順</option>
        </select>
    </form>

    <table border="1">
        <thead>
            <tr>
                <th>食材名</th>
                <th>数量</th>
                <th>カテゴリ</th>
                <th>期限</th>
                <th>開封日</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="item : ${ingredients}">
                <td th:text="${item.name}">卵</td>
                <td>
                    <form th:action="@{/ingredients/{id}/quantity(id=${item.id})}" method="post" style="display:inline">
                        <button type="button"
                                onclick="const q = this.form.quantity; q.value = Math.max(0, (parseFloat(q.value) || 0) - 1); this.form.submit();">−</button>
                        <input type="number" name="quantity" th:value="${item.quantityText}" step="any" min="0"
                               style="width:70px" onchange="this.form.submit()" required>
                        <button type="button"
                                onclick="const q = this.form.quantity; q.value = (parseFloat(q.value) || 0) + 1; this.form.submit();">＋</button>
                    </form>
                    <span th:text="${item.unit}">個</span>
                </td>
                <td th:text="${item.category}">その他</td>
                <!-- 期限切れは赤、3日以内はオレンジ -->
                <td th:text="${item.expiryType} + '：' + ${item.expiryDate}"
                    th:style="${item.expired} ? 'color: red' : (${item.expiringSoon} ? 'color: orange')">
                    賞味期限：2026-10-25
                </td>
                <td th:text="${item.openedDate}">-</td>
                <td>
                    <a th:href="@{/ingredients/{id}/edit(id=${item.id})}">編集</a>
                    <form th:action="@{/ingredients/{id}/delete(id=${item.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('削除しますか？');">
                        <button type="submit">削除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
