# ==================================================
#  テスト用の設定（プロファイル「test」）。
#  テストのクラスに @ActiveProfiles("test") を付けると、src/main/resources/application.properties の値を
#  ここに書いたものだけ上書きする
#  テストのときは、パソコンの ~/Recipes ではなく、メモリ上の空のデータベースを使う。
#  テーブルは src/test/resources/schema.sql で作る（本番と同じ形）
# ==================================================
# 名前を毎回ランダムにして、設定の違うテストどうしでデータベースが混ざらないようにする
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.springframework.security=WARN

# 写真はテスト用の一時フォルダに保存する
app.upload-dir=${java.io.tmpdir}/recipes-test-uploads

# パスワード再設定のメールのリンクの先頭
app.public-url=http://localhost:8081

# AI はテストでは呼ばない（つながらない場所を指しておく）
app.ai.ollama-url=http://localhost:1

# データベースの控えは、テストでは作らない
app.backup.dir=
