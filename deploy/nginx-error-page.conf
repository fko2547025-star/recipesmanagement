# ==================================================
#  nginx：アプリが止まっている・再起動中のときに「メンテナンス中」のページを出す設定
#
#  /etc/nginx/sites-available/recipe の、443 番（HTTPS）の server { ... } の中に、この数行を足す。
#  （certbot が書き足した「listen 443 ssl」がある server のほう。location / { ... } の外に書く）
#
#  ページのファイルは、deploy/maintenance.html を /var/www/cookbuddy/maintenance.html に置く。
# ==================================================

    # 502（アプリにつながらない）・503・504（返事が遅すぎる）のときは、メンテナンス中のページを出す
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/cookbuddy;
        internal;   # 直接 URL を打っても開けない（エラーのときだけ出す）
    }
