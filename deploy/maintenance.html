<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>メンテナンス中 | CookBuddy</title>
    <!--
        nginx が出す「メンテナンス中」のページ（502・503・504 のとき）。
        アプリが止まっている・再起動中のときに出るので、アプリの CSS やフォントは使わず、このファイルだけで表示できるようにしている。
        サーバーでは /var/www/cookbuddy/maintenance.html に置く（deploy/nginx-error-page.conf を参照）。
    -->
    <style>
        :root { --primary: #7b4a2e; --bg: #f7efe4; --surface: #fffaf3; --text: #4a3426; --muted: #8b7462; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
        }
        header { padding: 16px 24px; background: var(--primary); color: #fff; font-size: 1.4rem; font-weight: 700; }
        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
        .box {
            width: 100%;
            max-width: 520px;
            padding: 36px 28px;
            border-radius: 16px;
            background: var(--surface);
            box-shadow: 0 6px 20px rgba(80, 50, 30, 0.12);
            text-align: center;
        }
        .icon { font-size: 3rem; line-height: 1; }
        h1 { margin: 14px 0 10px; font-size: 1.35rem; }
        p { margin: 0 0 22px; line-height: 1.8; color: var(--muted); }
        button {
            padding: 12px 32px;
            border: none;
            border-radius: 999px;
            background: var(--primary);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>
    <header>🍳 CookBuddy</header>
    <main>
        <div class="box">
            <div class="icon">🛠️</div>
            <h1>ただいまメンテナンス中です</h1>
            <p>アプリの更新や再起動をしています。<br>1〜2分ほどで戻りますので、しばらくしてから再読み込みしてください。</p>
            <button type="button" onclick="location.reload()">再読み込み</button>
        </div>
    </main>
</body>
</html>
